<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listen to the town</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
    <script src="script.js"></script>
  </head>

  <body class="day">
    <main class="Scene" id="scene">
      <div class="Sky" id="sky"></div>
      <div class="Moon" id="moon"></div>
      <div class="City" id="city"></div>

      <div class="Fog">
        <div class="FogCloud" id="fogCloud"></div>
        <div class="FogController" id="fogController"></div>
      </div>

      <p class="Title">listen to the town</p>

      <div class="Instruction">
        <div class="InstructionRow">
          <p class="InstructionObject">небо</p>
          <p class="InstructionAction">click</p>
          <p class="InstructionResult">звон капли</p>
        </div>
        <div class="InstructionRow">
          <p class="InstructionObject">окна</p>
          <p class="InstructionAction">click</p>
          <p class="InstructionResult">нота в мелодии</p>
        </div>
        <div class="InstructionRow">
          <p class="InstructionObject">луна</p>
          <p class="InstructionAction">
            drag <img src="images/arrow.svg" alt="" />
          </p>
          <p class="InstructionResult">громкость гула</p>
        </div>
        <div class="InstructionRow">
          <p class="InstructionObject">туман</p>
          <p class="InstructionAction">
            drag <img src="images/arrow.svg" alt="" />
          </p>
          <p class="InstructionResult">слышимость эха</p>
        </div>

        <div class="SoundToggle muted" id="soundToggle">
          <div class="SoundTogglePlaque"></div>
          <svg
            class="SoundToggleIcon mute"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M10 8H14M7.33 3.33V12.67L4.67 10H2.67C2.3 10 2 9.7 2 9.33V6.67C2 6.3 2.3 6 2.67 6H4.67L7.33 3.33Z"
            />
          </svg>
          <svg
            class="SoundToggleIcon unmute"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M7.33 3.33V12.67L4.67 10H2.67C2.3 10 2 9.7 2 9.33V6.67C2 6.3 2.3 6 2.67 6H4.67L7.33 3.33Z"
            />
            <path
              d="M12.24 3.76C13.36 4.89 13.99 6.41 13.99 8C13.99 9.59 13.36 11.12 12.24 12.24"
            />
            <path
              d="M10.36 5.64C10.98 6.26 11.34 7.11 11.34 8C11.34 8.89 10.98 9.74 10.36 10.36"
            />
          </svg>
        </div>
      </div>
    </main>

    <nav class="Filters">
      <button class="FilterButton active" data-mode="day">день</button>
      <button class="FilterButton" data-mode="evening">вечер</button>
      <button class="FilterButton" data-mode="night">ночь</button>
    </nav>
  </body>
</html>
